<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Monitoring PTR - GIS 3D / 2D</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
        .glass-panel {
            background: rgba(11, 20, 38, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 242, 254, 0.25);
        }
        .ptr-marker {
            width: 32px; 
            height: 32px; 
            background: #0b1426; 
            border: 2px solid #00f2fe;
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: #00f2fe; 
            box-shadow: 0 0 12px #00f2fe; 
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .ptr-marker:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="w-full bg-slate-900 border-b border-cyan-500/30 p-3 flex justify-between items-center shadow-lg">
        <h1 class="text-lg font-bold text-white tracking-wider flex items-center gap-2">
            <i class="fas fa-cube text-cyan-400"></i> GEO-PTR 3D MONITORING
        </h1>
        <button onclick="toggle3DView()" id="btn3D" class="px-3 py-1.5 bg-cyan-500 hover:bg-cyan-400 text-black font-bold rounded text-xs transition-all">
            MODE: 3D PERSPEKTIF
        </button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
        
        <!-- SIDEBAR PANEL -->
        <aside class="lg:col-span-4 flex flex-col gap-4">
            <!-- DROPDOWN PILIHAN PTR -->
            <div class="glass-panel p-4 rounded-lg">
                <label class="text-xs font-mono text-slate-400 uppercase tracking-wider block mb-1">Pilih Lokasi PTR:</label>
                <select id="ptrSelect" onchange="onPTRChange()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white focus:outline-none focus:border-cyan-400">
                    <!-- Terisi Otomatis via JS -->
                </select>
            </div>

            <!-- DETAIL 9 INDIKATOR -->
            <div class="glass-panel p-4 rounded-lg flex flex-col gap-3">
                <h2 class="text-sm font-bold text-cyan-300 border-b border-slate-800 pb-2 tracking-wide flex justify-between items-center">
                    <span>DETAIL INDIKATOR PTR</span>
                    <span id="valStatus" class="text-[10px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">NORMAL</span>
                </h2>
                
                <!-- FOTO PTR -->
                <div class="relative w-full h-44 bg-slate-900 rounded border border-slate-700 overflow-hidden">
                    <img id="ptrFoto" src="" alt="Foto PTR" class="w-full h-full object-cover">
                </div>

                <!-- METADATA INDIKATOR -->
                <div class="grid grid-cols-2 gap-2 text-xs font-mono">
                    <div class="bg-slate-900/80 p-2 rounded border border-slate-800">
                        <span class="text-[10px] text-slate-400 block">NOMOR TR</span>
                        <div id="valTR" class="font-bold text-cyan-300 mt-0.5">-</div>
                    </div>
                    <div class="bg-slate-900/80 p-2 rounded border border-slate-800">
                        <span class="text-[10px] text-slate-400 block">KOORDINAT</span>
                        <div id="valCoord" class="font-bold text-white text-[11px] mt-0.5">-</div>
                    </div>
                    <div class="bg-slate-900/80 p-2 rounded border border-slate-800">
                        <span class="text-[10px] text-slate-400 block">PERBATASAN</span>
                        <div id="valNegara" class="font-bold text-amber-300 mt-0.5">-</div>
                    </div>
                    <div class="bg-slate-900/80 p-2 rounded border border-slate-800">
                        <span class="text-[10px] text-slate-400 block">PERAIRAN</span>
                        <div id="valPerairan" class="font-bold text-sky-300 mt-0.5 truncate">-</div>
                    </div>
                    <div class="bg-slate-900/80 p-2 rounded border border-slate-800">
                        <span class="text-[10px] text-slate-400 block">PROVINSI</span>
                        <div id="valProv" class="font-bold text-slate-200 mt-0.5">-</div>
                    </div>
                    <div class="bg-slate-900/80 p-2 rounded border border-slate-800">
                        <span class="text-[10px] text-slate-400 block">KAB/KOTA</span>
                        <div id="valKab" class="font-bold text-slate-200 mt-0.5">-</div>
                    </div>
                    <div class="bg-slate-900/80 p-2 rounded border border-slate-800 col-span-2">
                        <span class="text-[10px] text-slate-400 block">KECAMATAN</span>
                        <div id="valKec" class="font-bold text-slate-200 mt-0.5">-</div>
                    </div>
                    <div class="bg-slate-900/80 p-2 rounded border border-slate-800 col-span-2">
                        <span class="text-[10px] text-slate-400 block">KONDISI FISIK</span>
                        <div id="valKondisi" class="font-bold text-emerald-400 mt-0.5">-</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAP VIEWPORT -->
        <section class="lg:col-span-8 glass-panel rounded-lg p-2 min-h-[500px] flex flex-col relative overflow-hidden">
            <div id="map" class="w-full h-full rounded-md min-h-[480px]"></div>
        </section>

    </main>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let map, is3D = true;
        let ptrDataStore = {};

        // Data Cadangan (Mock Data) agar Tampil Sempurna di GitHub Pages
        const mockDataPTR = [
            {
                id: "PTR-01",
                nomor_tr: "TR-01 / PTR-01",
                nama_lokasi: "Pulau Rondo",
                foto_url: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=800&q=80",
                perbatasan_negara: "India (Kep. Nikobar)",
                perairan: "Samudra Hindia / Selat Malaka",
                provinsi: "Aceh",
                kabupaten_kota: "Kota Sabang",
                kecamatan: "Kec. Sukakarya",
                kondisi: "Baik / Utuh",
                status: "NORMAL",
                lng: 94.973914,
                lat: 5.792978
            },
            {
                id: "PTR-02",
                nomor_tr: "TR-02 / PTR-02",
                nama_lokasi: "Pulau Sekatung",
                foto_url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80",
                perbatasan_negara: "Vietnam & Malaysia",
                perairan: "Laut Natuna Utara",
                provinsi: "Kepulauan Riau",
                kabupaten_kota: "Kab. Natuna",
                kecamatan: "Kec. Pulau Laut",
                kondisi: "Sedikit Terkikis Air Laut",
                status: "WARNING",
                lng: 108.021944,
                lat: 4.795833
            },
            {
                id: "PTR-03",
                nomor_tr: "TR-03 / PTR-03",
                nama_lokasi: "Pulau Fanildo",
                foto_url: "https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=800&q=80",
                perbatasan_negara: "Palau",
                perairan: "Samudra Pasifik",
                provinsi: "Papua",
                kabupaten_kota: "Kab. Biak Numfor",
                kecamatan: "Kec. Kepulauan Mapia",
                kondisi: "Baik / Utuh",
                status: "NORMAL",
                lng: 134.288611,
                lat: 0.932222
            }
        ];

        window.onload = async () => {
            initMap();
            await loadDataFromAPI();
        };

        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                style: {
                    'version': 8,
                    'sources': {
                        'sat': {
                            'type': 'raster',
                            'tiles': ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                            'tileSize': 256
                        }
                    },
                    'layers': [{ 'id': 'sat-layer', 'type': 'raster', 'source': 'sat' }]
                },
                center: [94.973914, 5.792978],
                zoom: 14,
                pitch: 60,
                bearing: -20
            });

            map.addControl(new maplibregl.NavigationControl());
        }

        async function loadDataFromAPI() {
            let ptrList = [];

            try {
                // Mencoba mengambil data dari backend lokal
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1500); // Batas waktu 1.5 detik

                const response = await fetch('http://localhost:3000/api/v1/ptr', { signal: controller.signal });
                const result = await response.json();
                clearTimeout(timeoutId);

                if (result.success && result.data.length > 0) {
                    ptrList = result.data;
                } else {
                    ptrList = mockDataPTR;
                }
            } catch (e) {
                // Jika API Offline (Di-akses via GitHub Pages), gunakan mock data
                ptrList = mockDataPTR;
            }

            // Populate Dropdown & Peta
            const select = document.getElementById('ptrSelect');
            select.innerHTML = '';

            ptrList.forEach((item) => {
                ptrDataStore[item.id] = item;

                // Opsi Dropdown
                const option = document.createElement('option');
                option.value = item.id;
                option.innerText = `${item.nomor_tr} - ${item.nama_lokasi}`;
                select.appendChild(option);

                // Buat Marker Spasial di Peta
                const el = document.createElement('div');
                el.className = 'ptr-marker';
                el.innerHTML = '<i class="fas fa-monument text-xs"></i>';
                el.onclick = () => {
                    document.getElementById('ptrSelect').value = item.id;
                    onPTRChange();
                };

                new maplibregl.Marker(el)
                    .setLngLat([item.lng, item.lat])
                    .addTo(map);
            });

            if (ptrList.length > 0) onPTRChange();
        }

        function onPTRChange() {
            const id = document.getElementById('ptrSelect').value;
            const item = ptrDataStore[id];
            if (!item) return;

            // Update UI Sidebar
            document.getElementById('ptrFoto').src = item.foto_url;
            document.getElementById('valTR').innerText = item.nomor_tr;
            document.getElementById('valCoord').innerText = `${item.lat.toFixed(4)}°, ${item.lng.toFixed(4)}°`;
            document.getElementById('valNegara').innerText = item.perbatasan_negara;
            document.getElementById('valPerairan').innerText = item.perairan;
            document.getElementById('valProv').innerText = item.provinsi;
            document.getElementById('valKab').innerText = item.kabupaten_kota;
            document.getElementById('valKec').innerText = item.kecamatan;
            document.getElementById('valKondisi').innerText = item.kondisi;

            const statusEl = document.getElementById('valStatus');
            statusEl.innerText = item.status || 'NORMAL';
            if (item.status === 'WARNING') {
                statusEl.className = "text-[10px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30";
            } else {
                statusEl.className = "text-[10px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
            }

            // Animasi Pergerakan Kamera Peta
            map.flyTo({
                center: [item.lng, item.lat],
                zoom: 15.5,
                pitch: is3D ? 60 : 0,
                essential: true,
                duration: 2000
            });
        }

        function toggle3DView() {
            is3D = !is3D;
            document.getElementById('btn3D').innerText = is3D ? "MODE: 3D PERSPEKTIF" : "MODE: 2D FLAT";
            map.easeTo({ pitch: is3D ? 60 : 0, duration: 1000 });
        }
    </script>
</body>
</html>
